<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkyRoads Playground</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0d0d0d;
      color: #e0b3ff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    h1, h2, h3 {
      color: #d966ff;
      font-size: 2em;
    }

    section {
      margin: 40px 0;
      border: 1px solid #a64dff;
      padding: 20px;
      border-radius: 10px;
      background-color: #1a001a;
    }

    canvas {
      max-width: 100%;
    }

    audio {
      margin-top: 20px;
    }

    button {
      padding: 15px;
      background-color: #8000ff;
      border: none;
      color: white;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 20px;
    }

    button:hover {
      background-color: #a64dff;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      h1, h2, h3 {
        font-size: 1.5em;
      }
      
      button {
        font-size: 1em;
        padding: 12px;
      }

      section {
        padding: 10px;
      }

      canvas {
        width: 100%;
        height: auto;
      }
    }
  </style>
  <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
</head>
<body>

  <h1>🎮 Welcome to SkyRoads Playground</h1>

  <!-- Section: Game Start -->
  <section>
    <h2>1. Play SkyRoads</h2>
    <button onclick="startGame()">Click to Play the Game</button>
  </section>

  <!-- Background Music -->
  <audio id="background-audio" loop autoplay>
    <source src="https://cdn.pixabay.com/audio/2022/03/13/audio_6d187746dc.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function startGame() {
      // Hide the button and start the game
      document.querySelector("button").style.display = "none";
      
      // Create the game container
      const gameContainer = document.createElement('div');
      gameContainer.id = "dosbox";
      gameContainer.style.width = "100%";
      gameContainer.style.height = "100vh";
      gameContainer.style.position = "absolute";
      gameContainer.style.top = "0";
      gameContainer.style.left = "0";
      gameContainer.style.zIndex = "9999";
      
      // Append the game container to the body
      document.body.appendChild(gameContainer);
      
      // Initialize and load SkyRoads game
      Dos(gameContainer, {
        wdosboxUrl: "https://js-dos.com/6.22/current/wdosbox.js",
      }).ready((fs, main) => {
        fs.extract("https://js-dos.com/cdn/upload/skyroads.zip").then(() => {
          main(["-c", "skyroads"]);
        });
      });
    }
  </script>

</body>
</html>
